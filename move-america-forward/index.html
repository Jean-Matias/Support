<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Move America Forward, a Trump 2028 supporter project.">
  <title>Trump 2028 | Move America Forward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="headline">
      <p class="eyebrow">Move America Forward · Supporter project</p>
      <div class="wordmark">
        <div class="stars" aria-hidden="true">★ ★ ★ ★ ★</div>
        <h1 id="headline">TRUMP <span>2028</span></h1>
      </div>
      <p class="slogan">Make America Great Again</p>
      <div class="actions">
        <a class="button button-outline" href="how.html">How we’re doing it</a>
        <a class="button" href="donate.html">Donate</a>
        <a class="button button-outline" href="#newsletter">Join the newsletter</a>
      </div>
    </section>
    <section class="newsletter" id="newsletter" aria-labelledby="newsletter-title">
      <div class="newsletter-inner">
        <div>
          <h2 id="newsletter-title">Stay in the loop</h2>
          <p>Get updates from Move America Forward.</p>
        </div>
        <form id="signup">
          <label for="email">Email address</label>
          <div class="form-row">
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="signup-note">
            <button class="button" type="submit">Subscribe</button>
          </div>
          <p id="signup-note" role="status">Preview only. The signup service is pending.</p>
        </form>
      </div>
    </section>
  </main>
  <footer>
    <p class="disclaimer">Be part of the change. Help move America forward.</p>
  </footer>
</body>
</html>
